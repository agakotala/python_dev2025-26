<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title%}Biblioteka{% endblock %}</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            line-height: 1.6;
        }
        nav {
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #ccc;
        }
        nav a {
            margin-right: 15px;
            text-decoration: none;
        }
        .message {
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            background-color: #f5f5f5;
        }
        form {
            margin-bottom: 20px;
        }
        input, textarea, select, button {
            padding: 8px;
            margin-bottom: 10px;
            width: 100%;
            box-sizing: border-box;
        }
        button {
            width: auto;
            cursor: pointer;
        }
        ul{
            padding-left: 20px;
        }
    </style>
</head>
<body>
    <nav>
        <a href="{% url 'book_list' %}">Lista książek</a>
        <a href="{% url 'book_create' %}">Dodaj książkę</a>
        <a href="/admin/">Admin</a>
        <a href="{% url 'api_book_list' %}">API</a>
        <a href="{% url 'logout' %}">Wyloguj</a>
    </nav>

    {% if messages %}
        {% for message in messages %}
            <div class="message">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    {% block content %}
    {% endblock %}
</body>
</html>
