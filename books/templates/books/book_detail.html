{% extends "books/base.html" %}

{% block title %}{{ book.title }}{% endblock %}

{% block content %}
<h1>{{ book.title }}</h1>
<p>Autor: {{ book.author }}</p>
<p>Rok wydania: {{ book.published_year }}</p>
<p>Opis: {{ book.description }}</p>

<a href="{% url 'book_update' book.id %}">Edytuj</a><br>
<a href="{% url 'book_delete' book.id %}">Usuń</a>
{% endblock %}
